[project]
name = "bookforge"
version = "1.0.0"
description = "Plataforma integrada de remasterizacao, traducao e conversao editorial de livros (Screen, Print A4, Kindle PDF e EPUB 3)"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "typst>=0.12.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
